org: felipstein
frameworkVersion: '~4.34.0'
service: terrenos

provider:
  name: aws
  region: sa-east-1
  runtime: nodejs24.x
  architecture: arm64
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  environment:
    MAIN_TABLE_NAME: ${self:custom.resourceNames.MainTable}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    IMAGES_BUCKET_NAME: !Ref ImagesBucket
    PUBLIC_ASSET_BASE_URL: !Sub 'https://${ImagesBucket.RegionalDomainName}'
  iam:
    role:
      statements:
        # DynamoDB single-table.
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt MainTable.Arn
            - !Sub '${MainTable.Arn}/index/*'
        # Autoriza o presigned POST: o S3 valida o upload contra a permissão do
        # principal que assinou (esta role). Só no prefixo de imagens.
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: !Sub '${ImagesBucket.Arn}/images/*'
  httpApi:
    cors:
      allowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
        audience:
          - !Ref CognitoUserPoolClient

custom:
  resourceNames:
    MainTable: ${self:service}-${self:provider.stage}-table
    UserPool: ${self:service}-${self:provider.stage}-user-pool
    UserPoolClient: ${self:service}-${self:provider.stage}-user-pool-client
    ImagesBucket: ${self:service}-${self:provider.stage}-images-${aws:accountId}
  corsOrigins:
    prod:
      - '*' # trocar quando subir em prod o web
    dev:
      - '*'
  deletionProtection:
    dynamodb:
      prod: true
      dev: false
    cognito:
      prod: ACTIVE
      dev: INACTIVE

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    exclude:
      - '@aws-sdk/*'

functions:
  # ─── Público ───────────────────────────────────────────────────────────────
  health:
    handler: src/functions/health.handler
    events:
      - httpApi:
          method: GET
          path: /health

  authLogin:
    handler: src/functions/auth/login.handler
    events:
      - httpApi:
          method: POST
          path: /auth/login

  authRefresh:
    handler: src/functions/auth/refresh.handler
    events:
      - httpApi:
          method: POST
          path: /auth/refresh

  # ─── Protegido (Cognito JWT) ─────────────────────────────────────────────────
  meGet:
    handler: src/functions/me/get.handler
    events:
      - httpApi:
          method: GET
          path: /me
          authorizer:
            name: cognitoAuthorizer

  terrenosList:
    handler: src/functions/terrenos/list.handler
    events:
      - httpApi:
          method: GET
          path: /terrenos
          authorizer:
            name: cognitoAuthorizer

  terrenosCreate:
    handler: src/functions/terrenos/create.handler
    events:
      - httpApi:
          method: POST
          path: /terrenos
          authorizer:
            name: cognitoAuthorizer

  terrenosUpdate:
    handler: src/functions/terrenos/update.handler
    events:
      - httpApi:
          method: PUT
          path: /terrenos/{id}
          authorizer:
            name: cognitoAuthorizer

  terrenosDelete:
    handler: src/functions/terrenos/delete.handler
    events:
      - httpApi:
          method: DELETE
          path: /terrenos/{id}
          authorizer:
            name: cognitoAuthorizer

  uploadsCreate:
    handler: src/functions/uploads/create.handler
    events:
      - httpApi:
          method: POST
          path: /uploads
          authorizer:
            name: cognitoAuthorizer

  mapsResolveLink:
    handler: src/functions/maps/resolveLink.handler
    timeout: 10 # segue redirect do Google (fetch com timeout de 4s)
    events:
      - httpApi:
          method: POST
          path: /maps/resolve-link
          authorizer:
            name: cognitoAuthorizer

resources:
  Resources:
    # ─── DynamoDB (single-table) ─────────────────────────────────────────────
    MainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.resourceNames.MainTable}
        DeletionProtectionEnabled: ${self:custom.deletionProtection.dynamodb.${self:provider.stage}}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    # ─── S3 (imagens via presigned POST) ─────────────────────────────────────
    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.resourceNames.ImagesBucket}
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced # ACLs desligadas; leitura via bucket policy
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [POST]
              AllowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}}
              AllowedHeaders: ['*']
              MaxAge: 3000

    # Leitura pública só do prefixo de imagens (URLs com uuid, não-enumeráveis).
    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: PublicReadImages
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/images/*'

    # ─── Cognito ──────────────────────────────────────────────────────────────
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.resourceNames.UserPool}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 6
            RequireUppercase: false
            RequireLowercase: false
            RequireNumbers: false
            RequireSymbols: false
        DeletionProtection: ${self:custom.deletionProtection.cognito.${self:provider.stage}}

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.resourceNames.UserPoolClient}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        # Com RefreshTokenRotation habilitada, o Cognito já libera o refresh flow
        # implicitamente — listar ALLOW_REFRESH_TOKEN_AUTH aqui dá erro de deploy.
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED
        TokenValidityUnits:
          AccessToken: days
          RefreshToken: days
        AccessTokenValidity: 1
        RefreshTokenValidity: 365 # refresh longo + rotativo = "nunca relogar"
        RefreshTokenRotation:
          Feature: ENABLED
          RetryGracePeriodSeconds: 0
