openapi: 3.1.0
info:
  title: Terrenos API
  version: 0.1.0
  description: >
    Contrato da API do app Terrenos — fonte da verdade entre frontend e backend.
    As rotas foram inferidas dos services do front (terreno-service, auth-service,
    upload-service).

    Princípios: **performance, baixo custo e simplicidade**. A **busca e a
    ordenação são feitas no FRONTEND** (a lista é pequena) — por isso `GET /terrenos`
    retorna a lista inteira, **sem search e sem paginação** no servidor.

    Regra: rota nova ou retorno alterado => atualizar este arquivo na mesma mudança.
servers:
  - url: http://localhost:8080
    description: backend local (linguagem a definir)

# Protegido por padrão; rotas públicas sobrescrevem com `security: []`.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check do serviço
      security: []
      responses:
        "200":
          description: Serviço no ar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/login:
    post:
      operationId: login
      summary: Autentica e devolve a sessão (access + refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      operationId: refresh
      summary: Renova o access token a partir do refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshInput" }
      responses:
        "200":
          description: Novos access token e refresh token (rotacionado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: Refresh token inválido/expirado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me:
    get:
      operationId: getMe
      summary: Identidade da sessão atual (a partir do access token)
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401":
          description: Não autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /terrenos:
    get:
      operationId: listTerrenos
      summary: Lista TODOS os terrenos (busca/ordenação ficam no front)
      responses:
        "200":
          description: Lista de terrenos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Terreno" }
    post:
      operationId: createTerreno
      summary: Cria um terreno
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerrenoInput" }
      responses:
        "201":
          description: Terreno criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Terreno" }
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /terrenos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateTerreno
      summary: Atualiza um terreno
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerrenoInput" }
      responses:
        "200":
          description: Terreno atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Terreno" }
        "404":
          description: Não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteTerreno
      summary: Remove um terreno
      responses:
        "204":
          description: Removido
        "404":
          description: Não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /uploads:
    post:
      operationId: createUpload
      summary: Cria um alvo de upload (presigned POST) pra uma imagem
      description: >
        Padrão de mercado: o backend NÃO recebe o arquivo. Ele assina um
        **presigned POST** do S3 e devolve `{ upload, image }`. O cliente faz um
        `multipart/form-data` POST direto pro `upload.url` com os `upload.fields`
        + o arquivo (campo `file` por último). Depois do upload, `image` (`{ id,
        url }`) é o registro que entra em `Terreno.imagens`; `principalId` aponta
        a principal. O policy do POST trava tamanho (até 5MB) e content-type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Alvo de upload assinado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTarget" }
        "400":
          description: Content-type não suportado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /maps/resolve-link:
    post:
      operationId: resolveMapsLink
      summary: Resolve um link do Google Maps (inclusive curto) em coordenadas
      description: >
        O front resolve links COMPLETOS sozinho (parse no navegador). Link CURTO
        (maps.app.goo.gl) é um redirect que o navegador não segue por falta de
        CORS — então o backend segue o redirect server-side e extrai lat/lng.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveMapsLinkInput" }
      responses:
        "200":
          description: Coordenadas resolvidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedLocation" }
        "422":
          description: Não foi possível extrair coordenadas do link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok], example: ok }

    TerrenoImagem:
      type: object
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri }

    UploadInput:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          example: image/jpeg

    UploadTarget:
      type: object
      required: [upload, image]
      properties:
        upload:
          type: object
          description: Dados do presigned POST do S3.
          required: [url, fields]
          properties:
            url: { type: string, format: uri }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Campos do form que vão ANTES do arquivo no multipart.
        image: { $ref: "#/components/schemas/TerrenoImagem" }

    TerrenoInput:
      type: object
      required: [rua, preco, lat, lng, areaTotal]
      properties:
        rua: { type: string, example: "Rua das Palmeiras, 120" }
        preco: { type: number, description: BRL, example: 185000 }
        lat: { type: number, example: -22.9056 }
        lng: { type: number, example: -47.0608 }
        areaTotal: { type: number, description: m², example: 250 }
        largura: { type: number, description: metros, example: 10 }
        comprimento: { type: number, description: metros, example: 25 }
        link: { type: string, format: uri }
        imagens:
          type: array
          items: { $ref: "#/components/schemas/TerrenoImagem" }
        principalId:
          type: string
          description: id da imagem principal (aparece no pin/tabela/detalhe)

    Terreno:
      allOf:
        - { $ref: "#/components/schemas/TerrenoInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: identificador de login do usuário; carrega o e-mail.
        password: { type: string }

    AuthUser:
      type: object
      required: [username]
      properties:
        username: { type: string }

    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: segundos até o access token expirar, example: 3600 }
        user: { $ref: "#/components/schemas/AuthUser" }

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: >
            novo refresh token rotacionado; o anterior é invalidado
            imediatamente (rotation com grace period 0).
        expiresIn: { type: integer, example: 3600 }

    ResolveMapsLinkInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://maps.app.goo.gl/gY6f4xVaTYjQVhzP7

    ResolvedLocation:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, example: -22.9056 }
        lng: { type: number, example: -47.0608 }
        address: { type: string, example: "Rua das Palmeiras, 120 - Campinas, SP" }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Algo deu errado" }
